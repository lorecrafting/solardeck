name: SolarDeck Verification Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: 16-Phase System Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Build Essentials
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make

      - name: Install KiCad CLI (ERC / DRC)
        run: |
          sudo apt-get install -y --no-install-recommends kicad || echo "kicad unavailable; Phase 1b/1c will report SKIP"

      # Bundles are gitignored per .gitignore ("never commit them") and untracked;
      # regenerate FIRST so the verification run checks the freshly built bundles,
      # not stale committed placeholders (audit 5 finding C).
      - name: Regenerate production bundles (must be reproducible, not committed)
        run: |
          python3 hardware/export_production_zip.py

      - name: Run Master Verification Suite
        run: |
          python3 scripts/verify_all.py

      - name: Upload production bundles
        uses: actions/upload-artifact@v4
        with:
          name: solardeck-production
          path: hardware/production/*.zip
          if-no-files-found: warn
